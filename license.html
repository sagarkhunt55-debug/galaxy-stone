<!DOCTYPE html>
<html>
<head>
    <title>License Activation</title>

    <style>
        body{
            text-align:center;
            margin-top:120px;
            font-family:Arial;
            background:#f4f6fb;
        }

        h2{
            color:#4e73df;
        }

        input{
            padding:10px;
            width:300px;
            border:1px solid #ccc;
            border-radius:5px;
            outline:none;
        }

        button{
            padding:10px 20px;
            margin-top:10px;
            background:#2ac66f;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:#22a85a;
        }

        .footer{
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            background:white;
            border-top:1px solid #ddd;
            padding:8px;
            font-size:12px;
            color:#444;
        }

        .box{
            background:white;
            display:inline-block;
            padding:30px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Enter License Key</h2>

    <input id="key" placeholder="Enter your license key" />
    <br><br>

    <button onclick="sendKey()">Activate</button>

</div>

<div class="footer">
    Developed by <b>Sagar Khunt</b> | Contact: +91 7600171393
</div>

<script>
const { ipcRenderer } = require('electron');

function sendKey() {
    const key = document.getElementById("key").value;
    ipcRenderer.send("check-license", key);
}
</script>

</body>
</html>
